name: Security Manual Signoff CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

jobs:
  wait_for_approval:
    runs-on: ubuntu-latest
    steps:
      - name: Check for security team approval
        id: check_approval
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request || null;
            const issue = context.payload.issue || null;
            if (!pr && !issue) {
              core.setOutput('approved', false);
              return;
            }
            const pr_number = pr ? pr.number : issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });
            let approved = false;
            for (const comment of comments) {
              if (/security approved/i.test(comment.body)) {
                try {
                  const execSync = require('child_process').execSync;
                  const command = `
                    curl -s -H "Authorization: token ${{ secrets.GH_SECURITY_TOKEN }}" \
                         -H "Accept: application/vnd.github+json" \
                         https://api.github.com/orgs/josys-src/teams/josys-security-members/members
                  `;
                  const result = execSync(command, { encoding: 'utf-8' });
                  const members = JSON.parse(result);
                  const isMember = members.some(member => member.login === comment.user.login);
                  if (isMember) {
                    approved = true;
                    break;
                  }
                } catch (error) {
                  console.error("Error checking team membership: ", error.message);
                }
              }
            }
            core.setOutput('approved', approved);
      - name: Proceed if approved
        if: steps.check_approval.outputs.approved == 'true'
        run: echo "PR is approved by the security team, proceeding..."

      - name: Fail if not approved
        if: steps.check_approval.outputs.approved != 'true'
        run: |
          echo "Waiting for security team approval. Please comment 'Security Approved'."
          exit 1
