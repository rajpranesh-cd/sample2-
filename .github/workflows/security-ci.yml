name: Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  configure-aws:
    name: Configure AWS with OIDC
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
  
      - name: Determine Branch and Set Secrets
        id: branch-secrets
        run: |
          # Check if the branch is main, staging, or production
          if [[ "${{ github.ref_name }}" =~ ^(main|staging|production|qa1)$ ]]; then
            echo "Using PRODUCTION secrets"
            echo "AWS_ROLE=${{ secrets.JOSYS_SECURITY_AWS_ROLE }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.JOSYS_SECURITY_AWS_REGION }}" >> $GITHUB_ENV
            echo "S3_BUCKET=${{ secrets.JOSYS_SECURITY_S3_BUCKET_NAME }}" >> $GITHUB_ENV
            echo "FILE_KEY=${{ secrets.JOSYS_SECURITY_S3_FILE_KEY }}" >> $GITHUB_ENV
          else
            echo "Using DEV secrets"
            echo "AWS_ROLE=${{ secrets.JOSYS_DEV_SECURITY_AWS_ROLE }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.JOSYS_DEV_SECURITY_AWS_REGION }}" >> $GITHUB_ENV
            echo "S3_BUCKET=${{ secrets.JOSYS_DEV_SECURITY_S3_BUCKET_NAME }}" >> $GITHUB_ENV
            echo "FILE_KEY=${{ secrets.JOSYS_DEV_SECURITY_S3_FILE_KEY }}" >> $GITHUB_ENV
          fi
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHub-OIDC-TERRAFORM
          audience: sts.amazonaws.com
  
      - name: Fetch known vulnerabilities list from S3
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}
          FILE_KEY: ${{ env.FILE_KEY }}
        run: |
          echo "Fetching known vulnerabilities list from S3..."
          aws s3 cp s3://$S3_BUCKET/$FILE_KEY .
          echo "Known vulnerabilities list downloaded from S3."
  
      - name: Upload josys_known_ve_list.json as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: josys_known_ve_list
          path: josys_known_ve_list.json

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    needs: configure-aws
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download josys_known_ve_list.json artifact
        uses: actions/download-artifact@v4
        with:
          name: josys_known_ve_list
          path: .

      - name: Check for Node.js project
        id: node_detected
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            echo "is_node=true" >> $GITHUB_ENV
          else
            echo "is_node=false" >> $GITHUB_ENV
          fi

      - name: Run NPM/Yarn Audit
        if: env.is_node == 'true'
        run: |
          echo "@josys-src:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_AUTH_READ_TOKEN }}" >> .npmrc
          if [ -f "package-lock.json" ]; then
            npm install
            npm audit --json > audit-report.json || true
          elif [ -f "yarn.lock" ]; then
            yarn install
            yarn audit --json > audit-report.json || true
          fi

      - name: Extract GHSA IDs from NPM/Yarn Audit
        if: env.is_node == 'true'
        run: |
          if [ -f "audit-report.json" ]; then
            jq -r '.vulnerabilities | to_entries[] | .value.via[] | select(.url?) | .url' audit-report.json | 
              grep -oP 'GHSA-\w{4}-\w{4}-\w{4}' > ghsa_ids.txt || echo "No GHSA IDs found"
          fi

      - name: Check for Python project
        id: python_detected
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "is_python=true" >> $GITHUB_ENV
          else
            echo "is_python=false" >> $GITHUB_ENV
          fi

      - name: Run PIP Audit
        if: env.is_python == 'true'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json > pip_audit_report.json || true

      - name: Process Python Vulnerabilities
        if: env.is_python == 'true'
        run: |
          # Create empty file if it doesn't exist
          touch extracted_vuln_ids.txt
          
          # Safely extract vulnerabilities even if empty
          jq -r '.vulnerabilities // [] | .[].id' pip_audit_report.json > extracted_vuln_ids.txt || true
          
          echo "Processing vulnerabilities from:"
          cat extracted_vuln_ids.txt
          
          # Create GHSA ID file if it doesn't exist
          touch ghsa_ids.txt
          
          while IFS= read -r vuln_id; do
            if [[ -n "$vuln_id" ]]; then
              if [[ "$vuln_id" == PYSEC-* ]]; then
                echo "Processing PYSEC vulnerability: $vuln_id"
                response=$(curl -s "https://api.osv.dev/v1/vulns/$vuln_id" || echo '{}')
                ghsa_id=$(echo "$response" | jq -r '.aliases[] | select(startswith("GHSA-"))' | head -1)
                
                if [ -n "$ghsa_id" ]; then
                  echo "Mapped $vuln_id to $ghsa_id"
                  echo "$ghsa_id" >> ghsa_ids.txt
                else
                  echo "No GHSA ID found for $vuln_id"
                fi
              else
                echo "Adding vulnerability ID: $vuln_id"
                echo "$vuln_id" >> ghsa_ids.txt
              fi
            fi
          done < extracted_vuln_ids.txt
          
          echo "Final GHSA IDs:"
          cat ghsa_ids.txt

       # Step Detect Ruby project (Gemfile)
      - name: Check for Ruby project
        id: ruby_detected
        run: |
          if [ -f "Gemfile" ]; then
            echo "Ruby project detected."
            echo "is_ruby=true" >> $GITHUB_ENV
          else
            echo "No Ruby project found."
            echo "is_ruby=false" >> $GITHUB_ENV
          fi

      - name: Set up rbenv and Ruby
        if: env.is_ruby == 'true'
        continue-on-error: true
        run: |
          echo "Installing rbenv and Ruby..."
          sudo apt-get update
          sudo apt-get install -y rbenv ruby-build
          echo 'export PATH="$HOME/.rbenv/bin:$PATH"' >> ~/.bashrc
          echo 'eval "$(rbenv init -)"' >> ~/.bashrc
          source ~/.bashrc
          rbenv install 3.2.0 || echo "Ruby version 3.2.0 not found. Trying alternative versions..."
          rbenv global 3.2.0 || echo "Failed to set Ruby version 3.2.0 as global."
          echo "Ruby version:"
          ruby --version || echo "Ruby is not installed."

      - name: Install Bundler and Bundler Audit
        if: env.is_ruby == 'true'
        continue-on-error: true
        run: |
          echo "Installing bundler and bundler-audit..."
          gem install bundler bundler-audit --user-install || echo "Failed to install bundler or bundler-audit."
          GEM_PATH="$HOME/.local/share/gem/ruby/3.2.0/bin"
          echo "PATH=$GEM_PATH:$PATH" >> $GITHUB_ENV
          echo "Installed bundler and bundler-audit."

      - name: Run Bundler Audit
        if: env.is_ruby == 'true'
        continue-on-error: true
        env:
          PATH: ${{ env.PATH }}
        run: |
          echo "Running bundler-audit..."
          bundle install || echo "Failed to install dependencies."
          bundler-audit check --gemfile-lock Gemfile.lock --update > bundler_audit_report.txt || true
          echo "Contents of bundler_audit_report.txt:"
          cat bundler_audit_report.txt

      - name: Extract GHSA IDs from Bundler Audit Report
        if: env.is_ruby == 'true'
        run: |
          echo "Extracting GHSA IDs from bundler_audit_report.txt..."
          grep -oP 'GHSA-\w{4}-\w{4}-\w{4}' bundler_audit_report.txt >> ghsa_ids.txt || echo "No GHSA IDs found."
          echo "Extracted GHSA IDs:"
          cat ghsa_ids.txt

      - name: Generate Vulnerability Report
        if: env.is_node == 'true' || env.is_python == 'true' || env.is_ruby == 'true'
        env:
          GH_SECURITY_TOKEN: ${{ secrets.GH_SECURITY_TOKEN }}
        run: |
          echo "GHSA ID,CVE ID,Package Name,Ecosystem,Severity,Description,Affected Version,Patched Version,URL,Note" > vulnerability-report.csv
          jq -r '.dependencies_exception_list[]' josys_known_ve_list.json > known_ghsa_ids.txt

          sort -u ghsa_ids.txt | while read -r ghsa_id; do
            NOTE="New vulnerability found"
            grep -Fxq "$ghsa_id" known_ghsa_ids.txt && NOTE="Skipped - known vulnerability"

            ADVISORY_JSON=$(curl -s -H "Authorization: Bearer $GH_SECURITY_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/advisories/$ghsa_id")

            SEVERITY=$(echo "$ADVISORY_JSON" | jq -r '.severity')
            DESCRIPTION=$(echo "$ADVISORY_JSON" | jq -r '.description' | tr -d '\n' | tr ',' ';')
            URL=$(echo "$ADVISORY_JSON" | jq -r '.html_url')
            CVES=$(echo "$ADVISORY_JSON" | jq -r '[.identifiers[] | select(.type == "CVE").value] | join(", ")')

            echo "$ADVISORY_JSON" | jq -c '.vulnerabilities[]' | while read -r vuln; do
              PACKAGE=$(echo "$vuln" | jq -r '.package.name')
              ECOSYSTEM=$(echo "$vuln" | jq -r '.package.ecosystem')
              VERSION=$(echo "$vuln" | jq -r '.vulnerable_version_range')
              PATCHED=$(echo "$vuln" | jq -r '.first_patched_version')

              echo "\"$ghsa_id\",\"$CVES\",\"$PACKAGE\",\"$ECOSYSTEM\",\"$SEVERITY\",\"$DESCRIPTION\",\"$VERSION\",\"$PATCHED\",\"$URL\",\"$NOTE\"" >> vulnerability-report.csv
            done || echo "\"$ghsa_id\",\"$CVES\",\"N/A\",\"N/A\",\"$SEVERITY\",\"$DESCRIPTION\",\"N/A\",\"N/A\",\"$URL\",\"$NOTE\"" >> vulnerability-report.csv
          done

          echo "Generated report:"
          cat vulnerability-report.csv

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: Dependency-Vulnerability-Report
          path: vulnerability-report.csv

      - name: Check Critical/High Severity Vulnerabilities
        run: |
          CRITICAL_FOUND=$(awk -F, 'tolower($5) ~ /critical|high/ && $10 == "\"New vulnerability found\""' vulnerability-report.csv | wc -l)
          
          if [ "$CRITICAL_FOUND" -gt 0 ]; then
            echo "::error::Critical/High severity vulnerabilities found. Failing build."
            echo "=============================================================="
            echo "Critical/High Vulnerabilities:"
            awk -F, 'tolower($5) ~ /critical|high/ && $10 == "\"New vulnerability found\""' vulnerability-report.csv
            echo "=============================================================="
            exit 1
          else
            echo "No Critical/High severity vulnerabilities found. Build continues."
          fi

  secret-scan:
    name: Secret Scanning with Gitleaks
    runs-on: ubuntu-latest
    needs: configure-aws
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download josys_known_ve_list.json artifact
        uses: actions/download-artifact@v4
        with:
          name: josys_known_ve_list
          path: .

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Create .gitleaksignore file
        run: |
          echo "Creating .gitleaksignore file from josys_known_ve_list.json..."
          jq -r '.secrets_exception_list[]' josys_known_ve_list.json > .gitleaksignore
          echo "Contents of .gitleaksignore:"
          cat .gitleaksignore

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: false
        run: |
          gitleaks detect --source=. --no-git --redact -v --exit-code=2 --report-format=csv --report-path=results.csv --log-level=debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.csv

      - name: Check for Gitleaks exit code
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected leaks. Failing the build."
          exit 1
  Generate-SBOM:
    runs-on: ubuntu-22.04
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          image: "dir:."
  
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dependencies
          path: sbom.spdx.json
